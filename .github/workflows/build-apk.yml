name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$CMDLINE"

          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          cp -r cmdline-tools/* "$CMDLINE/"

          export ANDROIDSDK="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$CMDLINE/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          mkdir -p "$SDK_ROOT/licenses"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /tmp/licenses.log 2>&1 || true

          echo "Installing required Android packages..."

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking Build-Tools..."
          test -f "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -f "$SDK_ROOT/build-tools/35.0.0/aidl"

          echo "Android SDK is ready."

      - name: Configure Buildozer
        run: |
          if ! grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi

      - name: Build APK
        shell: bash
        run: |
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"
          export PATH="$HOME/.local/bin:$ANDROIDSDK/platform-tools:$ANDROIDSDK/build-tools/35.0.0:$PATH"

          buildozer android debug

      - name: Check APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mymusic-apk
          path: bin/*.apk

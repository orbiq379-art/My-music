      name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Get your project
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 3. Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev


      # 4. Python / Buildozer
      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel

          python3 -m pip install --user \
            buildozer \
            cython==0.29.36

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # 5. Install Android SDK manually
      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK_ROOT=$SDK_ROOT"

          # Clean old/broken SDK
          rm -rf "$SDK_ROOT"

          mkdir -p "$SDK_ROOT"


          # Download Android command-line tools
          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip


          # Install command-line tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -r cmdline-tools/* \
            "$SDK_ROOT/cmdline-tools/latest/"


          # IMPORTANT:
          # Older Buildozer expects sdkmanager here:
          # android-sdk/tools/bin/sdkmanager

          mkdir -p "$SDK_ROOT/tools"

          ln -s \
            "$SDK_ROOT/cmdline-tools/latest" \
            "$SDK_ROOT/tools/bin"


          # Environment
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"


          # Verify sdkmanager
          echo "Checking sdkmanager..."

          "$SDK_ROOT/tools/bin/sdkmanager" --version


          # Accept licenses
          echo "Accepting Android SDK licenses..."

          yes | "$SDK_ROOT/tools/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true


          # Install required SDK packages
          echo "Installing Android SDK packages..."

          "$SDK_ROOT/tools/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          # Verify installation
          echo "Checking Android Build Tools..."

          test -f "$SDK_ROOT/build-tools/35.0.0/aapt"

          test -f "$SDK_ROOT/build-tools/35.0.0/aidl"

          test -f "$SDK_ROOT/platform-tools/adb"


          echo "======================================"
          echo "Android SDK installation successful!"
          echo "======================================"


      # 6. Configure Buildozer
      - name: Configure Buildozer
        shell: bash
        run: |
          set -e

          if ! grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              '/^\[app\]/a android.accept_sdk_license = True' \
              buildozer.spec
          fi

          echo "Buildozer configuration:"
          grep -E \
            "^(title|package.name|package.domain|requirements|android\.)" \
            buildozer.spec || true


      # 7. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"

          export PATH="$HOME/.local/bin:$ANDROIDSDK/tools/bin:$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$ANDROIDSDK/build-tools/35.0.0:$PATH"

          echo "Java:"
          java -version

          echo "Python:"
          python3 --version

          echo "Buildozer:"
          buildozer --version

          echo "SDK:"
          "$ANDROIDSDK/tools/bin/sdkmanager" --version

          echo "Starting Buildozer..."

          buildozer android debug


      # 8. Check APK
      - name: Check APK
        shell: bash
        run: |
          echo "APK files:"

          find bin \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK was not created."
            exit 1
          fi


      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mymusic-apk
          path: bin/*.apk
          if-no-files-found: error

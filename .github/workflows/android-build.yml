name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            gettext libltdl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TOOLS="$SDK/cmdline-tools/latest"

          rm -rf "$SDK"
          mkdir -p "$TOOLS"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip

          cp -r cmdline-tools/* "$TOOLS/"

          # Tell GitHub Actions where the SDK is
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$TOOLS/bin/sdkmanager"

          echo "Checking sdkmanager..."
          test -f "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking installation..."

          test -f "$SDK/build-tools/35.0.0/aapt"
          test -f "$SDK/build-tools/35.0.0/aidl"

          echo "✅ Android SDK installed successfully."

      - name: Configure Buildozer
        run: |
          if ! grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              '/^\[app\]/a android.accept_sdk_license = True' \
              buildozer.spec
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"

          export PATH="$HOME/.local/bin:$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "SDK Manager:"
          "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "🚀 Building APK..."

          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |
          echo "Checking APK..."

          find bin -type f -name "*.apk" -print

          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "❌ APK was not created."
            exit 1
          fi

          echo "✅ APK successfully created!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-APK
          path: bin/*.apk
          if-no-files-found: error
